[project]
name = "interview-prep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "elianezanlorense", email = "58109901+elianezanlorense@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "duckdb>=1.5.6",
    "huggingface-hub>=2.1.1",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-frontmatter>=1.3.0",
    "requests>=2.34.2",
]

[project.scripts]
interview-prep = "interview_prep:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
